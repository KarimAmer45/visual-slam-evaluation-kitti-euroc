[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-slam-evaluation-kitti-euroc"
version = "0.1.0"
description = "Compact visual SLAM/visual odometry evaluation toolkit for KITTI and EuRoC trajectories."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "KarimAmer45" }]
dependencies = [
  "numpy>=1.23",
  "matplotlib>=3.6",
  "opencv-python-headless>=4.8"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.4"
]

[project.scripts]
slam-eval = "slam_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

